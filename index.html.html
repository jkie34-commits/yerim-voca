<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>간호 영어 단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0FAF6;--card:#FFFFFF;--ink:#25403C;--soft:#5E7B76;--line:#D3EBE3;
  --main:#1F8A73;--main-ink:#FFFFFF;--pink:#FFC8DD;--butter:#FFF1B8;--sky:#CDE9FF;--mint:#B8EBD8;
  --ok:#1F8A73;--no:#C2415F;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#14221E;--card:#1E322D;--ink:#E7F5F0;--soft:#9CBDB5;--line:#2C4740;--main:#5FD3B6;--main-ink:#10211C;--ok:#5FD3B6;--no:#FF8FAB}
}
:root[data-theme="dark"]{--bg:#14221E;--card:#1E322D;--ink:#E7F5F0;--soft:#9CBDB5;--line:#2C4740;--main:#5FD3B6;--main-ink:#10211C;--ok:#5FD3B6;--no:#FF8FAB}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-padding-bottom:100px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.6}
h1,h2,h3,.jua{font-family:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px calc(100px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.mascot{width:52px;height:52px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font-size:30px;flex:none;box-shadow:0 4px 0 #f3a9c6}
.mascot{animation:bob 1.2s ease-out 1}
@keyframes bob{0%{transform:translateY(0)}40%{transform:translateY(-10px) rotate(-6deg)}70%{transform:translateY(0) rotate(4deg)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.mascot{animation:none}}
header h1{font-size:26px;line-height:1.15}
header p{margin:2px 0 0;color:var(--soft);font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:6px;background:var(--card);border-top:2px solid var(--line);border-radius:22px 22px 0 0;padding:8px max(10px,calc((100% - 760px)/2)) calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:0;background:transparent;color:var(--soft);font-family:"Jua",sans-serif;font-size:14px;line-height:1.2;border-radius:18px;cursor:pointer}
nav button .ic{font-size:22px;line-height:1.1}
nav button[aria-selected="true"]{background:var(--main);color:var(--main-ink)}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid #FF8FB8;outline-offset:2px}
section[hidden]{display:none}
.panel{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:16px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
input[type=text],input[type=search],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
textarea{resize:vertical;min-height:70px}
.tools input[type=search]{flex:1;min-width:160px}
label.chk{display:flex;align-items:center;gap:8px;min-height:44px;font-size:15px;color:var(--soft);cursor:pointer}label.chk input{width:20px;height:20px}
.chips{display:flex;gap:6px;margin:0 -2px 14px;padding:2px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border:2px solid transparent;border-radius:999px;padding:7px 14px;flex:none;white-space:nowrap;font:inherit;font-size:15px;color:#25403C;background:var(--mint);cursor:pointer}
.chip[aria-pressed="true"]{border-color:#25403C}
.chip.c1{background:var(--pink)}.chip.c2{background:var(--butter)}.chip.c3{background:var(--sky)}.chip.c0{background:var(--mint)}
.count{color:var(--soft);font-size:14px;margin:0 0 10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.word{background:var(--bg);border:2px solid var(--line);border-radius:20px;padding:14px 14px 12px;position:relative}
.word .en{font-family:"Jua",sans-serif;font-size:22px;line-height:1.25;word-break:break-word;padding-right:28px}
.word .ko{margin-top:4px;font-weight:700;color:var(--main)}
.word .note{margin:6px 0 0;font-size:14px;color:var(--soft)}
.word .tag{display:inline-block;margin-top:8px;font-size:12px;padding:1px 10px;border-radius:999px;color:#25403C}
.word.hide .ko,.word.hide .note{visibility:hidden}
.word.hide{cursor:pointer}
.word.hide::after{content:"눌러서 뜻 보기";position:absolute;left:14px;right:14px;top:44px;color:var(--soft);font-size:14px}
.del{position:absolute;top:4px;right:4px;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--soft);font-size:16px;cursor:pointer}
.del:hover{background:var(--pink);color:#25403C}
.btn{font-family:"Jua",sans-serif;font-size:17px;border:0;border-radius:999px;min-height:48px;padding:10px 22px;background:var(--main);color:var(--main-ink);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.block{width:100%}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.field{margin-bottom:14px}
.field label{display:block;font-family:"Jua",sans-serif;font-size:16px;margin-bottom:4px}
.msg{min-height:1.6em;margin:10px 0 0;font-size:15px}
.msg.err{color:var(--no)}.msg.ok{color:var(--ok)}
.empty{text-align:center;color:var(--soft);padding:28px 8px}
.seg{display:flex;gap:8px;margin:10px 0 18px;flex-wrap:wrap}
.seg button{flex:1;min-width:130px;min-height:48px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;border-radius:14px;padding:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--butter);border-color:#25403C;color:#25403C}
.bar{height:12px;background:var(--bg);border-radius:999px;overflow:hidden;border:2px solid var(--line)}
.bar i{display:block;height:100%;background:var(--pink);border-radius:999px;transition:width .3s}
.qhead{display:flex;justify-content:space-between;color:var(--soft);font-size:14px;margin-bottom:6px}
.qbox{background:var(--sky);color:#25403C;border-radius:22px;padding:22px 16px;text-align:center;margin:16px 0}
.qbox small{display:block;font-size:14px;opacity:.8}
.qbox .q{font-family:"Jua",sans-serif;font-size:28px;line-height:1.25;word-break:break-word}
.opts{display:grid;gap:10px}
.opt{text-align:left;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:16px;min-height:54px;padding:14px 16px;cursor:pointer}
.opt:disabled{cursor:default}
.opt.right{background:var(--mint);border-color:var(--ok);color:#25403C}
.opt.wrong{background:var(--pink);border-color:var(--no);color:#25403C}
.fb{margin:14px 0 0;padding:12px 14px;border-radius:16px;background:var(--butter);color:#25403C;font-size:15px}
.result{text-align:center}
.result .big{font-family:"Jua",sans-serif;font-size:54px;line-height:1.1}
.wlist{text-align:left;margin:16px 0 0;padding:0;list-style:none}
.wlist li{padding:8px 12px;border-radius:12px;background:var(--bg);margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mascot" aria-hidden="true">🩺</div>
    <div>
      <h1>간호 영어 단어장</h1>
      <p>간호대학생을 위한 필수 영단어, 하루 한 줌씩 쏙쏙!</p>
    </div>
  </header>

  <section id="list" class="panel" role="tabpanel" aria-labelledby="t-list">
    <div class="tools">
      <input type="search" id="search" placeholder="영어 또는 한글로 검색" aria-label="단어 검색">
      <label class="chk"><input type="checkbox" id="hideKo"> 뜻 가리고 외우기</label>
    </div>
    <div class="chips" id="chips"></div>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
    <p style="margin:18px 0 0;text-align:center"><button class="btn ghost" id="restore" style="font-size:15px;min-height:44px;padding:6px 18px">기본 단어 복원</button></p>
  </section>

  <section id="add" class="panel" role="tabpanel" aria-labelledby="t-add" hidden>
    <h2 style="font-size:24px;margin-bottom:12px">새 단어 추가하기</h2>
    <div class="field"><label for="f-en">영어 단어</label><input type="text" id="f-en" placeholder="예: hypertension" autocomplete="off"></div>
    <div class="field"><label for="f-ko">한글 뜻</label><input type="text" id="f-ko" placeholder="예: 고혈압" autocomplete="off"></div>
    <div class="field"><label for="f-cat">분류</label><input type="text" id="f-cat" list="cats" placeholder="예: 질환" autocomplete="off"><datalist id="cats"></datalist></div>
    <div class="field"><label for="f-note">한글 설명 (선택)</label><textarea id="f-note" placeholder="예: 혈압이 정상보다 높게 유지되는 상태"></textarea></div>
    <button class="btn block" id="addBtn">단어 저장</button>
    <p class="msg" id="addMsg" role="status" aria-live="polite"></p>
  </section>

  <section id="quiz" class="panel" role="tabpanel" aria-labelledby="t-quiz" hidden>
    <div id="quizBox"></div>
  </section>
</div>

<nav role="tablist" aria-label="메뉴">
  <button role="tab" id="t-list" aria-selected="true" data-tab="list"><span class="ic" aria-hidden="true">📖</span>단어장</button>
  <button role="tab" id="t-add" aria-selected="false" data-tab="add"><span class="ic" aria-hidden="true">➕</span>단어 추가</button>
  <button role="tab" id="t-quiz" aria-selected="false" data-tab="quiz"><span class="ic" aria-hidden="true">🎯</span>퀴즈</button>
</nav>

<script>
const SEED=[
["vital signs","활력징후","사정","체온, 맥박, 호흡, 혈압을 합쳐 부르는 말이에요. 환자 상태의 기본 지표예요."],
["blood pressure","혈압","사정","혈액이 혈관 벽에 가하는 압력이에요."],
["pulse","맥박","사정","심장이 뛸 때 동맥에서 느껴지는 박동이에요."],
["respiration","호흡","사정","숨을 들이쉬고 내쉬는 것. 분당 횟수를 세요."],
["body temperature","체온","사정","몸의 온도예요. 고막, 겨드랑이, 구강 등에서 측정해요."],
["assessment","사정(평가)","사정","간호과정의 첫 단계로, 환자 정보를 모으고 평가하는 일이에요."],
["fever","발열","증상","체온이 정상보다 높아진 상태예요."],
["pain","통증","증상","불쾌한 신체·정서적 경험이에요. 0~10점 척도로 자주 평가해요."],
["nausea","메스꺼움","증상","토할 것 같은 느낌이에요."],
["vomiting","구토","증상","위 속 내용물이 입으로 나오는 것이에요."],
["dizziness","어지러움","증상","빙글빙글 돌거나 휘청이는 느낌이에요."],
["dyspnea","호흡곤란","증상","숨쉬기 힘들다고 느끼는 증상이에요."],
["edema","부종","증상","조직 사이에 체액이 고여 붓는 현상이에요."],
["symptom","증상","증상","환자가 직접 느끼고 호소하는 불편함이에요."],
["hypertension","고혈압","질환","혈압이 정상보다 높게 유지되는 상태예요."],
["hypotension","저혈압","질환","혈압이 정상보다 낮은 상태예요."],
["pressure ulcer","욕창","질환","오래 눌린 피부와 조직이 손상되는 것이에요. 체위변경으로 예방해요."],
["allergy","알레르기","질환","특정 물질에 몸이 과민하게 반응하는 것이에요."],
["diagnosis","진단","의료행위","증상과 검사로 질병을 판단하는 것이에요."],
["prognosis","예후","의료행위","질병이 앞으로 어떻게 진행될지에 대한 예측이에요."],
["admission","입원","의료행위","환자가 병원에 들어와 치료를 시작하는 것이에요."],
["discharge","퇴원","의료행위","치료를 마치고 병원을 나가는 것이에요."],
["informed consent","설명 후 동의","의료행위","치료 내용을 충분히 설명 듣고 환자가 동의하는 것이에요."],
["fasting","금식","의료행위","검사나 수술 전에 음식을 먹지 않는 것이에요."],
["injection","주사","투약","약물을 바늘로 몸 안에 넣는 방법이에요."],
["intravenous (IV)","정맥 내(수액·주사)","투약","정맥 혈관으로 약이나 수액을 넣는 방법이에요."],
["dosage","투약 용량","투약","한 번에 주는 약의 양이에요."],
["prescription","처방(전)","투약","의사가 약을 쓰도록 지시한 내용이에요."],
["side effect","부작용","투약","약의 원하지 않는 반응이에요."],
["stethoscope","청진기","기구","심장·폐 소리를 듣는 도구예요."],
["thermometer","체온계","기구","체온을 재는 기구예요."],
["syringe","주사기","기구","약물을 주입하거나 뽑는 도구예요."],
["catheter","카테터(도관)","기구","체내에 넣어 소변이나 약물이 지나가게 하는 가는 관이에요."],
["sterile","멸균된","기구","세균이 하나도 없는 상태예요. 무균술에서 중요해요."],
["specimen","검체","기구","검사를 위해 채취한 혈액, 소변 등이에요."]
];
const KEY='nursevocab-v1';
const $=id=>document.getElementById(id);
const seed=()=>SEED.map((w,i)=>({id:'s'+i,en:w[0],ko:w[1],cat:w[2],note:w[3]}));
function load(){try{const r=localStorage.getItem(KEY);if(r){const a=JSON.parse(r);if(Array.isArray(a))return a}}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(words))}catch(e){}}
let words=load(),filterCat='전체',quiz=null;
const catClass=c=>'c'+([...c].reduce((a,ch)=>a+ch.charCodeAt(0),0)%4);
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

/* tabs */
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
  ['list','add','quiz'].forEach(t=>$(t).hidden=t!==b.dataset.tab);
  window.scrollTo(0,0);
  if(b.dataset.tab==='quiz'&&!quiz)showStart();
}));

/* list */
function cats(){return [...new Set(words.map(w=>w.cat).filter(Boolean))]}
function renderList(){
  const q=$('search').value.trim().toLowerCase(),hide=$('hideKo').checked;
  const cs=cats();if(filterCat!=='전체'&&!cs.includes(filterCat))filterCat='전체';
  const chips=$('chips');chips.innerHTML='';
  ['전체',...cs].forEach(c=>{
    const b=el('button','chip '+(c==='전체'?'c0':catClass(c)),c);
    b.setAttribute('aria-pressed',c===filterCat);
    b.onclick=()=>{filterCat=c;renderList()};chips.appendChild(b)});
  $('cats').innerHTML='';cs.forEach(c=>{const o=document.createElement('option');o.value=c;$('cats').appendChild(o)});
  const list=words.filter(w=>(filterCat==='전체'||w.cat===filterCat)&&(!q||(w.en+w.ko+(w.note||'')).toLowerCase().includes(q)));
  $('count').textContent=`단어 ${list.length}개`;
  const g=$('grid');g.innerHTML='';
  if(!list.length){g.appendChild(el('div','empty',words.length?'검색 결과가 없어요. 다른 단어로 찾아보세요.':'단어장이 비었어요. “단어 추가” 탭에서 첫 단어를 넣어보세요.'));return}
  list.forEach(w=>{
    const d=el('div','word'+(hide?' hide':''));
    d.appendChild(el('div','en',w.en));
    d.appendChild(el('div','ko',w.ko));
    if(w.note)d.appendChild(el('p','note',w.note));
    if(w.cat){const t=el('span','tag',w.cat);t.style.background=['var(--mint)','var(--pink)','var(--butter)','var(--sky)'][+catClass(w.cat)[1]];d.appendChild(t)}
    const x=el('button','del','✕');x.setAttribute('aria-label',w.en+' 삭제');
    x.onclick=e=>{e.stopPropagation();if(confirm(`“${w.en}” 단어를 삭제할까요?`)){words=words.filter(v=>v.id!==w.id);save();quiz=null;renderList()}};
    d.appendChild(x);
    if(hide)d.onclick=()=>d.classList.toggle('hide');
    g.appendChild(d)});
}
$('search').oninput=renderList;$('hideKo').onchange=renderList;
$('restore').onclick=()=>{
  const have=new Set(words.map(w=>w.en.toLowerCase()));
  const add=seed().filter(w=>!have.has(w.en.toLowerCase()));
  words=[...words,...add];save();quiz=null;renderList();
  alert(add.length?`기본 단어 ${add.length}개를 다시 넣었어요.`:'복원할 기본 단어가 없어요.');
};

/* add */
function msg(t,type){const m=$('addMsg');m.textContent=t;m.className='msg '+type}
$('addBtn').onclick=()=>{
  const en=$('f-en').value.trim(),ko=$('f-ko').value.trim(),cat=$('f-cat').value.trim(),note=$('f-note').value.trim();
  if(!en||!ko){msg('영어 단어와 한글 뜻을 모두 입력해 주세요.','err');return}
  if(words.some(w=>w.en.toLowerCase()===en.toLowerCase())){msg(`“${en}”은(는) 이미 단어장에 있어요.`,'err');return}
  words.unshift({id:'u'+Date.now(),en,ko,cat,note});save();quiz=null;
  ['f-en','f-ko','f-cat','f-note'].forEach(i=>$(i).value='');
  msg(`“${en}” 저장했어요! 단어장 맨 앞에서 확인할 수 있어요.`,'ok');
  $('f-en').focus();renderList();
};

/* quiz */
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function showStart(mode){
  quiz=null;const b=$('quizBox');b.innerHTML='';
  mode=mode||'en';
  b.appendChild(el('h2','','퀴즈로 복습하기')).style.fontSize='24px';
  b.appendChild(el('p','count','문제 유형을 고르고 시작해요. 최대 10문제가 나와요.'));
  const seg=el('div','seg');
  [['en','영어 → 한글 뜻 고르기'],['ko','한글 → 영어 단어 고르기']].forEach(([k,t])=>{
    const s=el('button','',t);s.setAttribute('aria-pressed',k===mode);s.onclick=()=>showStart(k);seg.appendChild(s)});
  b.appendChild(seg);
  if(words.length<4){b.appendChild(el('div','empty','퀴즈는 단어가 4개 이상 있어야 시작할 수 있어요. 단어를 더 추가해 주세요.'));return}
  const go=el('button','btn block','퀴즈 시작');go.onclick=()=>start(mode);b.appendChild(go);
}
function start(mode){
  const picks=shuffle(words).slice(0,Math.min(10,words.length));
  quiz={mode,qs:picks.map(w=>{
    const ans=mode==='en'?w.ko:w.en,key=mode==='en'?'ko':'en';
    const wrong=shuffle(words.filter(v=>v.id!==w.id&&v[key]!==ans)).slice(0,3).map(v=>v[key]);
    return {w,q:mode==='en'?w.en:w.ko,ans,opts:shuffle([ans,...wrong])}}),i:0,score:0,wrong:[],done:false};
  renderQ();
}
function renderQ(){
  const b=$('quizBox');b.innerHTML='';
  if(quiz.i>=quiz.qs.length)return renderResult();
  const q=quiz.qs[quiz.i],n=quiz.qs.length;
  const h=el('div','qhead');h.appendChild(el('span','',`${quiz.i+1} / ${n}`));h.appendChild(el('span','',`맞힌 개수 ${quiz.score}`));b.appendChild(h);
  const bar=el('div','bar');const fill=document.createElement('i');fill.style.width=(quiz.i/n*100)+'%';bar.appendChild(fill);b.appendChild(bar);
  const qb=el('div','qbox');qb.appendChild(el('small','',quiz.mode==='en'?'이 단어의 뜻은?':'이 뜻에 맞는 영어 단어는?'));qb.appendChild(el('div','q',q.q));b.appendChild(qb);
  const opts=el('div','opts');b.appendChild(opts);
  const fb=el('div','fb');fb.hidden=true;fb.setAttribute('role','status');b.appendChild(fb);
  const next=el('button','btn block',quiz.i+1===n?'결과 보기':'다음 문제');next.hidden=true;next.style.marginTop='14px';b.appendChild(next);
  q.opts.forEach(o=>{
    const ob=el('button','opt',o);
    ob.onclick=()=>{
      const ok=o===q.ans;
      opts.querySelectorAll('button').forEach(x=>{x.disabled=true;if(x.textContent===q.ans)x.classList.add('right')});
      if(ok)quiz.score++;else{ob.classList.add('wrong');quiz.wrong.push(q.w)}
      fb.hidden=false;
      fb.textContent=(ok?'정답이에요! 🎉 ':'아쉬워요, 다시 기억해 봐요. 💦 ')+`${q.w.en} = ${q.w.ko}`+(q.w.note?` — ${q.w.note}`:'');
      next.hidden=false;next.focus();next.scrollIntoView({block:'nearest'});
    };
    opts.appendChild(ob)});
  next.onclick=()=>{quiz.i++;renderQ()};
}
function renderResult(){
  const b=$('quizBox');b.innerHTML='';
  const n=quiz.qs.length,r=quiz.score/n,d=el('div','result');
  d.appendChild(el('div','',r===1?'🏆':r>=.7?'🌟':r>=.4?'🌱':'💪'));
  d.appendChild(el('div','big',`${quiz.score} / ${n}`));
  d.appendChild(el('p','',r===1?'모두 맞혔어요! 완벽한 예비 간호사예요.':r>=.7?'아주 잘했어요! 조금만 더 다듬어 봐요.':r>=.4?'좋은 시작이에요. 틀린 단어를 다시 살펴봐요.':'괜찮아요, 반복하면 금방 늘어요!'));
  if(quiz.wrong.length){
    d.appendChild(el('h3','','다시 볼 단어')).style.cssText='font-size:20px;text-align:left;margin-top:14px';
    const ul=el('ul','wlist');quiz.wrong.forEach(w=>ul.appendChild(el('li','',`${w.en} — ${w.ko}`)));d.appendChild(ul)}
  const row=el('div','');row.style.cssText='display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px';
  const again=el('button','btn','같은 유형으로 다시');again.onclick=()=>start(quiz.mode);
  const menu=el('button','btn ghost','유형 다시 고르기');menu.onclick=()=>showStart(quiz.mode);
  row.append(again,menu);d.appendChild(row);b.appendChild(d);
}

renderList();
</script>
